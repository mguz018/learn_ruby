# This repo's Netlify site publishes the Ruby course pages (the NN_*/index.html
# files and assets/style.css) straight from the repo root, with no build step.
#
# Adding a root package.json for the Spar app turned on Netlify's Node
# auto-detection, which tried to build it and failed. Spar has no web version —
# it is an Expo app and "no web version" is an explicit v1 non-goal — so the
# right answer is to state the original behavior explicitly rather than to give
# Netlify something to build.
[build]
  publish = "."
  command = ""
  ignore = "true"

[build.environment]
  NETLIFY_USE_YARN = "false"
