# Netlify configuration.
# If you connect the whole repo, set the base to this subdirectory in the
# Netlify UI, or keep the base setting below when deploying from the repo root.
[build]
  base = "kumon-math"
  command = "npm run build"
  publish = "dist"

# Single-page app: route everything through index.html so client-side
# navigation and refreshes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
